name: Deploy to GitHub Pages

on:
  # Deploy whenever a change lands on the default branch.
  push:
    branches: [main]
  # Allow a manual deploy from the Actions tab.
  workflow_dispatch:

# Permissions required to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, but never cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    # Target the same environment as the deploy job so a
    # NEXT_PUBLIC_CONTACT_EMAIL defined under Settings > Environments >
    # github-pages is visible here too — this is the job that bakes it in.
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Verify contact email
        env:
          # Repository variable (Settings > Secrets and variables > Actions >
          # Variables) with a repository secret of the same name as a fallback.
          # Either works; the value is public, so a secret buys nothing here.
          CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || secrets.NEXT_PUBLIC_CONTACT_EMAIL }}
        run: |
          if [ -z "$CONTACT_EMAIL" ]; then
            echo "::warning title=Contact email not configured::NEXT_PUBLIC_CONTACT_EMAIL is empty, so the contact section will show a placeholder. Add it under Settings > Secrets and variables > Actions > Variables (repository scope)."
          else
            echo "NEXT_PUBLIC_CONTACT_EMAIL is set; it will be embedded in the static export."
          fi

      - name: Build
        run: npm run build
        env:
          # Sub-path of the Pages site (empty for user/org sites and custom domains).
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || secrets.NEXT_PUBLIC_CONTACT_EMAIL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
